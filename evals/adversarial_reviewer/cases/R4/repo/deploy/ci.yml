name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli
          curl -sSL https://tools.example.org/install.sh | sh
      - name: Deploy
        run: ./deploy.sh
